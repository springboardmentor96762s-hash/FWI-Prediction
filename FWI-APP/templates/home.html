<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FWI Result</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

/* DARK BACKGROUND */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: #0b0b0b;
    color: #ffffff;
}

/* RESULT CARD */
.card {
    background: rgba(255, 255, 255, 0.08);
    padding: 35px;
    width: 420px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 35px rgba(255,0,0,0.4);
}

/* HEADINGS */
h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 15px;
}

h2 {
    font-size: 20px;
    margin: 8px 0;
}

/* FWI VALUE */
.fwi-value {
    font-size: 32px;
    font-weight: 700;
    color: #ffcc00;
    margin: 15px 0;
}

/* RISK TEXT */
.risk-text {
    font-size: 22px;
    font-weight: 700;
    color: #ff3b3b;
    margin-bottom: 20px;
}

/* FIRE METER */
.fire-meter {
    font-size: 32px;
    margin: 20px 0;
}

.fire-symbol {
    opacity: 0.3;
    filter: drop-shadow(0 0 8px orange);
}

.fire-symbol.active {
    opacity: 1;
}

/* BUTTON */
.btn {
    margin-top: 25px;
    background: linear-gradient(45deg, #ff3b3b, #ff0000);
    color: white;
    padding: 12px 22px;
    border-radius: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,0,0,0.6);
}
</style>
</head>

<body>

<div class="card">
    <h1>🔥 Fire Weather Index</h1>

    <div class="fwi-value">FWI: {{ prediction }}</div>
    <div class="risk-text">{{ risk }}</div>

    <!-- Fire Symbols -->
    <div class="fire-meter">
        <span class="fire-symbol" id="fire1">🔥</span>
        <span class="fire-symbol" id="fire2">🔥</span>
        <span class="fire-symbol" id="fire3">🔥</span>
        <span class="fire-symbol" id="fire4">🔥</span>
    </div>

    <form action="/">
        <button class="btn">Predict Again</button>
    </form>
</div>

<script>
    let risk = "{{ risk }}";

    const fires = [
        document.getElementById("fire1"),
        document.getElementById("fire2"),
        document.getElementById("fire3"),
        document.getElementById("fire4")
    ];

    let activeCount = 0;
    if (risk.includes("Moderate")) activeCount = 1;
    else if (risk.includes("High")) activeCount = 2;
    else if (risk.includes("Extreme")) activeCount = 4;

    for (let i = 0; i < activeCount; i++) {
        fires[i].classList.add("active");
    }
</script>

</body>
</html>

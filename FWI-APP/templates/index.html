<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FWI Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

/* DARK BACKGROUND */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: #0b0b0b;   /* solid dark black */
}

/* Glassmorphic card */
.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 40px 30px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 0 30px rgba(255,0,0,0.3);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
}

/* Title */
h2 {
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

h2::before {
    content: "🔥";
    font-size: 30px;
}

/* Two-column grid */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

/* Mobile responsive */
@media (max-width: 576px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}

/* Glass input */
.form-floating > .form-control {
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
    color: #ffffff;
    box-shadow: inset 0 0 6px rgba(255,255,255,0.15);
}

.form-floating > .form-control:focus {
    border-color: #ff3b3b;
    box-shadow: 0 0 12px rgba(255,59,59,0.7);
    background: rgba(255,255,255,0.08);
}

/* Label text */
label {
    color: rgba(255,255,255,0.8);
}

/* Button */
.btn-predict {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 15px;
    border: none;
    background: linear-gradient(45deg, #ff3b3b, #ff0000);
    color: #ffffff;
    letter-spacing: 0.5px;
}

.btn-predict:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,0,0,0.6);
}
</style>
</head>

<body>

<div class="card">
    <h2>Fire Weather Index Predictor</h2>

    <form action="/predict" method="post">
        <div class="form-grid">
            {% for feature in features %}
            <div class="form-floating">
                <input type="number" step="any" name="{{ feature }}" class="form-control" placeholder=" " required>
                <label>{{ feature }}</label>
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn-predict">Predict FWI</button>
    </form>
</div>

</body>
</html>
